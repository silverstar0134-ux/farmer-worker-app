<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Farmer Work App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
}
.bg{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(
        135deg,
        #ff9a9e,
        #fad0c4,
        #fbc2eb,
        #a1c4fd,
        #c2e9fb
    );
    background-size:300% 300%;
    animation:colorFlow 12s ease infinite;
    z-index:-2;
}

@keyframes colorFlow{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
    from{ opacity:0; transform:translateY(20px); }
    to{ opacity:1; transform:translateY(0); }
}

.logo{
    font-size:50px;
}

h1{
    color:#2e7d32;
    margin-top:10px;
}

.tagline{
    margin:10px 0 30px;
    color:#444;
    font-size:15px;
}

/* Buttons */
.buttons{
    width:100%;
    max-width:320px;
}

.buttons a{
    display:block;
    padding:14px;
    margin-bottom:15px;
    text-decoration:none;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
}

.register{
    background:#4caf50;
    color:#fff;
}

.login{
    border:2px solid #4caf50;
    color:#2e7d32;
}

.register:hover{
    background:#43a047;
}

.login:hover{
    background:#e8f5e9;
}

/* Language */
.lang{
    margin-top:20px;
    font-size:13px;
    color:#555;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="clouds"></div>

<div class="container">
    <div class="logo">🌾</div>
    <h1>Farmer Work</h1>
    <p class="tagline">
        Connecting Farmers & Workers<br>
        விவசாயிகள் & வேலைக்காரர்கள் இணைப்பு
    </p>

    <div class="buttons">
        <a href="{% url 'farmer_register' %}" class="register">Farmer Register</a>
        <a href="{% url 'worker_register' %}" class="register" style="background:#2196F3; margin-bottom:15px;">Worker Register</a>
        <a href="{% url 'login' %}" class="login">Login</a>
        <a href="{% url 'admin_login' %}" class="login" style="border-color:#ff9800; color:#ff9800;">Admin Login</a>
    </div>

    <div class="lang">
        தமிழ் | English
    </div>
</div>

</body>
</html>
